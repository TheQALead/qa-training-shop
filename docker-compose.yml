services:
  qa-shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-training-shop
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      # Persist database
      - qa-shop-db:/app/db
    restart: no
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/init"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  qa-shop-db:
    driver: local
